name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Default (shallow) checkout on purpose: this scans only the commits
      # in the current push/PR event, not the full repo history. Historical
      # findings already reviewed (see PROJECT_REFERENCE.md security section)
      # stay out of scope instead of being re-flagged on every run.
      - uses: actions/checkout@v4

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
