name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Default (shallow) checkout on purpose: this scans only the commits
      # in the current push/PR event, not the full repo history. Historical
      # findings already reviewed (see PROJECT_REFERENCE.md security section)
      # stay out of scope instead of being re-flagged on every run.
      # Pinned to an immutable commit SHA (not a mutable tag) so a compromised
      # or force-moved tag upstream can't silently change what this workflow
      # runs -- see PROJECT_REFERENCE.md security section. Bump deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
