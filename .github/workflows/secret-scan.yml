name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required for gitleaks-action's push-event diffing
      # (it runs `git log <before>^..<after>`, which needs those commits
      # present locally -- the default depth-1 shallow clone only has the
      # single latest commit and fails outright on any push with >1 commit).
      # This does NOT widen what gets scanned: gitleaks-action still only
      # scans the commit range for this specific push/PR event, not full
      # history -- fetch-depth just has to be enough for git to resolve that
      # range. Historical findings already reviewed (see PROJECT_REFERENCE.md
      # security section) stay out of scope either way.
      #
      # Pinned to an immutable commit SHA (not a mutable tag) so a compromised
      # or force-moved tag upstream can't silently change what this workflow
      # runs -- see PROJECT_REFERENCE.md security section. Bump deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
